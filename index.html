<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小明 · 个人主页</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 64px 20px;
      font-family: system-ui, sans-serif;
      line-height: 1.8;
      color: #26334d;
      background: #f2f5fb;
    }
    main {
      max-width: 720px;
      margin: auto;
      padding: clamp(24px, 6vw, 56px);
      background: white;
      border-radius: 24px;
      box-shadow: 0 16px 60px #26334d12;
    }
    h1 { margin: 0; font-size: 36px; }
    h2 { margin-top: 32px; font-size: 21px; }
    .intro { color: #667085; }
    a { color: #4263eb; text-underline-offset: 4px; }
    footer { margin-top: 40px; font-size: 14px; color: #667085; }
  </style>
</head>
<body>
  <main>
    <h1>你好，我是小明 👋</h1>
    <p class="intro">学生 / 开发者 / 摄影爱好者</p>

    <h2>关于我</h2>
    <p>我喜欢编程、阅读和探索新事物。这里记录我的作品与生活。</p>

    <h2>我的作品</h2>
    <ul>
      <li>
        <a href="https://github.com/yourname/project">
          项目名称
        </a>
        —— 用一句话介绍你的项目。
      </li>
    </ul>

    <h2>联系我</h2>
    <p>
      <a href="https://github.com/yourname">GitHub</a>
      ·
      <a href="mailto:hello@example.com">电子邮箱</a>
    </p>

    <footer>保持好奇，持续创造。</footer>
  </main>
</body>
</html>
