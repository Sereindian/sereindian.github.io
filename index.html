  <title>Sereindian · 个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e6dbc7;
      --ink: #062b8a;
      --secondary: #3a5aa8;
      --surface: #ddd0b9;
      --focus: #062b8a;
      --font: "Public Sans", "PingFang SC", "Microsoft YaHei", sans-serif;
      --font-display: "Libre Bodoni", "Bodoni MT", "Times New Roman", serif;
      --text-small: .875rem;
      --text-body: 1rem;
      --text-lead: clamp(1.125rem, 1rem + .35vw, 1.375rem);
      --text-quote: clamp(1.375rem, 1rem + 1.25vw, 2.125rem);
      --text-display: clamp(3.25rem, 13.6vw, 13rem);
      --ease: cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 2rem; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: var(--text-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration-thickness: .07em; text-underline-offset: .2em; touch-action: manipulation; }
    a:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }
    ::selection { color: var(--paper); background: var(--ink); }
    .shell { width: min(1280px, calc(100% - 96px)); margin-inline: auto; }
    .skip-link { position: fixed; inset: -100px auto auto 20px; z-index: 10; padding: 12px 20px; background: var(--ink); color: var(--paper); }
    .skip-link:focus { top: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 24px; }
    .wordmark { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; text-decoration: none; }
    .jump-link { display: inline-flex; align-items: center; min-height: 44px; gap: 12px; text-decoration: none; }
    .jump-link svg { width: 18px; height: 18px; transition: transform .2s var(--ease); }
    .jump-link:hover svg { transform: translateY(3px); }
    .hero { padding-block: 58px 72px; }
    .name-frame { overflow: clip; padding-block: .04em .1em; }
    h1 { margin: 0; font-family: var(--font-display); font-size: var(--text-display); font-weight: 400; line-height: 1.1; letter-spacing: -.055em; }
    h1 span { display: block; animation: name-arrive .8s var(--ease) both; }
    .introduction { margin: 24px 0 0; font-size: var(--text-lead); line-height: 1.65; animation: arrive .7s .12s var(--ease) both; }
    .introduction strong { font-weight: 700; }
    .content-grid { display: grid; grid-template-columns: 1.12fr 1fr; align-items: start; gap: clamp(56px, 8vw, 136px); padding-bottom: 84px; }
    .personal-quote { margin: 0; animation: arrive .7s .18s var(--ease) both; }
    blockquote { margin: 0; }
    .german { max-width: 29ch; margin: 0; font-family: var(--font-display); font-size: var(--text-quote); font-weight: 400; line-height: 1.45; letter-spacing: -.015em; text-wrap: pretty; }
    figcaption { margin-top: 22px; font-size: var(--text-small); line-height: 1.7; }
    figcaption span { display: block; }
    .source { color: var(--secondary); text-decoration: none; }
    .source:hover { color: var(--ink); text-decoration: underline; }
    .translation { margin-top: 22px; }
    .translation summary { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; list-style: none; font-size: var(--text-small); }
    .translation summary::-webkit-details-marker { display: none; }
    .translation summary svg { width: 16px; height: 16px; transition: transform .2s var(--ease); }
    .translation[open] summary svg { transform: rotate(180deg); }
    .translation p { margin: 4px 0 0; font-size: var(--text-body); line-height: 1.85; white-space: nowrap; }
    .social-section h2 { margin: 0 0 24px; font-size: var(--text-lead); font-weight: 500; line-height: 1.4; }
    .social-list { display: grid; grid-template-columns: repeat(6, 64px); gap: 16px; padding: 0; margin: 0; list-style: none; }
    .social-item { animation: arrive .65s calc(.2s + var(--order) * .055s) var(--ease) both; }
    .social-entry { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; color: var(--ink); text-decoration: none; cursor: pointer; line-height: 0; transition: transform .2s var(--ease); }
    .social-entry svg { display: block; width: 30px; height: 30px; fill: currentColor; }
    .social-entry[data-platform="xiaohongshu"] svg { width: 44px; height: 44px; }
    .social-entry:where(:hover, :focus-visible) { color: var(--paper); background: var(--ink); transform: translateY(-3px); }
    .social-entry:focus-visible { outline-offset: 4px; }
    .social-entry:active { transform: translateY(0) scale(.96); }
    .footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px 32px; padding-block: 24px 32px; color: var(--secondary); font-size: var(--text-small); }
    .footer p { margin: 0; }
    .footer a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
    .footer a:hover { color: var(--ink); text-decoration: underline; }
    @keyframes name-arrive { from { transform: translateY(105%); } to { transform: translateY(0); } }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 1100px) {
      .social-list { grid-template-columns: repeat(3, 64px); }
    }
    @media (max-width: 900px) {
      .shell { width: calc(100% - 56px); }
      .hero { padding-block: 44px 56px; }
      .content-grid { gap: 48px; grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 800px) {
      .content-grid { grid-template-columns: 1fr; gap: 52px; }
      .german { max-width: 29ch; }
      .social-list { grid-template-columns: repeat(6, 56px); gap: 12px; }
      .social-entry { width: 56px; height: 56px; }
    }
    @media (max-width: 640px) {
      :root { --text-display: clamp(2.75rem, 13.4vw, 5.25rem); }
      .shell { width: calc(100% - 40px); }
      .header { padding-block: 16px; gap: 16px; }
      .wordmark, .jump-link { font-size: var(--text-small); }
      .jump-link { gap: 8px; }
      .hero { padding-block: 36px 52px; }
      .introduction { margin-top: 22px; }
      .content-grid { grid-template-columns: 1fr; gap: 52px; padding-bottom: 40px; }
      .german { max-width: 27ch; line-height: 1.5; }
      figcaption { margin-top: 18px; }
      .translation { margin-top: 12px; }
      .translation p { font-size: clamp(.8125rem, 3.6vw, 1rem); }
      .social-section h2 { margin-bottom: 26px; }
      .footer { padding-block: 20px 24px; }
    }
    @media (max-width: 480px) {
      .social-list {
        width: min(100%, 176px);
        grid-template-columns: repeat(3, 56px);
        column-gap: 4px;
        row-gap: 12px;
        justify-items: center;
      }
      .social-entry { width: 56px; height: 56px; }
    }
    @media (max-width: 360px) {
      .shell { width: calc(100% - 32px); }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
