<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="你好，我是 Sereindian，也可以叫我 Leon。我的个人介绍、喜欢的一句话，以及社交主页。">
  <meta name="theme-color" content="#e6dbc7">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Sereindian · 个人主页">
  <meta property="og:description" content="每一个不曾起舞的日子，都是对生活的辜负。">
  <meta property="og:url" content="https://sereindian.github.io/">
  <link rel="canonical" href="https://sereindian.github.io/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23062b8a'/%3E%3Ctext x='32' y='46' text-anchor='middle' fill='%23e6dbc7' font-family='Arial,sans-serif' font-weight='700' font-size='44'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;500;700;900&display=swap" rel="stylesheet">
  <title>Sereindian · 个人主页</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #e6dbc7;
      --ink: #062b8a;
      --secondary: #3a5aa8;
      --surface: #ddd0b9;
      --focus: #062b8a;
      --font: "Chivo", "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      --text-small: .875rem;
      --text-body: 1rem;
      --text-lead: clamp(1.125rem, 1rem + .35vw, 1.375rem);
      --text-quote: clamp(1.375rem, 1rem + 1.25vw, 2.125rem);
      --text-display: clamp(3.25rem, 13.6vw, 13rem);
      --ease: cubic-bezier(.2,.7,.2,1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 2rem; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: var(--text-body); line-height: 1.6; -webkit-font-smoothing: antialiased; }
    a { color: inherit; text-decoration-thickness: .07em; text-underline-offset: .2em; touch-action: manipulation; }
    a:focus-visible, summary:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }
    ::selection { color: var(--paper); background: var(--ink); }
    .shell { width: min(1280px, calc(100% - 96px)); margin-inline: auto; }
    .skip-link { position: fixed; inset: -100px auto auto 20px; z-index: 10; padding: 12px 20px; background: var(--ink); color: var(--paper); }
    .skip-link:focus { top: 16px; }
    .header { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding-block: 24px; }
    .wordmark { display: inline-flex; align-items: center; min-height: 44px; font-weight: 700; text-decoration: none; }
    .jump-link { display: inline-flex; align-items: center; min-height: 44px; gap: 12px; text-decoration: none; }
    .jump-link svg { width: 18px; height: 18px; transition: transform .2s var(--ease); }
    .jump-link:hover svg { transform: translateY(3px); }
    .hero { padding-block: 58px 72px; }
    .name-frame { overflow: clip; padding-block: .04em .1em; }
    h1 { margin: 0; font-size: var(--text-display); font-weight: 900; line-height: 1.02; letter-spacing: -.065em; }
    h1 span { display: block; animation: name-arrive .8s var(--ease) both; }
    .introduction { margin: 24px 0 0; font-size: var(--text-lead); line-height: 1.65; animation: arrive .7s .12s var(--ease) both; }
    .introduction strong { font-weight: 700; }
    .content-grid { display: grid; grid-template-columns: 1.12fr 1fr; align-items: start; gap: clamp(56px, 8vw, 136px); padding-bottom: 84px; }
    .personal-quote { margin: 0; animation: arrive .7s .18s var(--ease) both; }
    blockquote { margin: 0; }
    .german { max-width: 29ch; margin: 0; font-size: var(--text-quote); font-weight: 400; line-height: 1.45; letter-spacing: -.025em; text-wrap: pretty; }
    figcaption { margin-top: 22px; font-size: var(--text-small); line-height: 1.7; }
    figcaption span { display: block; }
    .source { color: var(--secondary); text-decoration: none; }
    .source:hover { color: var(--ink); text-decoration: underline; }
    .translation { margin-top: 22px; }
    .translation summary { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; list-style: none; font-size: var(--text-small); }
    .translation summary::-webkit-details-marker { display: none; }
    .translation summary svg { width: 16px; height: 16px; transition: transform .2s var(--ease); }
    .translation[open] summary svg { transform: rotate(180deg); }
    .translation p { max-width: 26ch; margin: 4px 0 0; font-size: var(--text-body); line-height: 1.85; }
    .social-section h2 { margin: 0 0 28px; font-size: var(--text-lead); font-weight: 500; line-height: 1.4; }
    .social-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; row-gap: 32px; padding: 0; margin: 0; list-style: none; }
    .social-item { min-width: 0; animation: arrive .65s calc(.2s + var(--order) * .055s) var(--ease) both; }
    .social-entry { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; min-height: 60px; align-items: start; text-decoration: none; }
    a.social-entry { cursor: pointer; }
    .social-icon { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 30px; }
    .social-icon svg { display: block; width: 24px; height: 24px; }
    .social-copy { min-width: 0; }
    .social-copy strong { display: block; font-size: var(--text-lead); font-weight: 700; line-height: 1.4; }
    .social-copy small { display: block; margin-top: 5px; color: var(--secondary); font-size: var(--text-small); font-weight: 400; line-height: 1.5; overflow-wrap: anywhere; }
    .social-entry:where(:hover, :focus-visible) strong { text-decoration: underline; text-underline-offset: .2em; }
    a.social-entry .social-icon { transition: transform .2s var(--ease); }
    a.social-entry:hover .social-icon { transform: translateY(-2px); }
    a.social-entry:active .social-icon { transform: translateY(0); }
    .pending .social-copy strong { font-weight: 500; }
    .footer { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px 32px; padding-block: 24px 32px; color: var(--secondary); font-size: var(--text-small); }
    .footer p { margin: 0; }
    .footer a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
    .footer a:hover { color: var(--ink); text-decoration: underline; }
    @keyframes name-arrive { from { transform: translateY(105%); } to { transform: translateY(0); } }
    @keyframes arrive { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 900px) {
      .shell { width: calc(100% - 56px); }
      .hero { padding-block: 44px 56px; }
      .content-grid { gap: 48px; grid-template-columns: 1fr 1fr; }
      .social-list { column-gap: 16px; }
      .social-entry { grid-template-columns: 22px minmax(0, 1fr); gap: 9px; }
      .social-icon { width: 22px; }
      .social-icon svg { width: 21px; height: 21px; }
    }
    @media (max-width: 640px) {
      :root { --text-display: clamp(2.75rem, 13.4vw, 5.25rem); }
      .shell { width: calc(100% - 40px); }
      .header { padding-block: 16px; gap: 16px; }
      .wordmark, .jump-link { font-size: var(--text-small); }
      .jump-link { gap: 8px; }
      .hero { padding-block: 36px 52px; }
      .introduction { margin-top: 22px; }
      .content-grid { grid-template-columns: 1fr; gap: 52px; padding-bottom: 40px; }
      .german { max-width: 27ch; line-height: 1.5; }
      figcaption { margin-top: 18px; }
      .translation { margin-top: 12px; }
      .social-section h2 { margin-bottom: 26px; }
      .social-list { column-gap: 24px; row-gap: 28px; }
      .social-entry { grid-template-columns: 24px minmax(0, 1fr); gap: 10px; }
      .social-icon { width: 24px; }
      .social-icon svg { width: 23px; height: 23px; }
      .footer { padding-block: 20px 24px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
